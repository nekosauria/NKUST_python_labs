<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Demo Portal</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* 背景 */
#bg {
    position: fixed;
    width: 100%;
    height: 100%;

    background-size: contain;     /* ✅ 不裁切 */
    background-repeat: no-repeat; /* ✅ 不重複 */
    background-position: center; /* ✅ 置中 */
    background-color: white;     /* ✅ 留白顏色 */

    transition: background-image 0.6s ease-in-out;
}

/* overlay */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.35);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
}

/* responsive text */
h1 {
    font-size: 6vw;
    margin: 0;
}

p {
    font-size: 2vw;
}

/* mobile adjust */
@media (max-width: 600px) {
    h1 { font-size: 10vw; }
    p { font-size: 4vw; }
}
</style>

</head>

<body>

<div id="bg"></div>

<div class="overlay" onclick="nextImage()">
    <h1>Demo Portal</h1>
</div>

<script>
const bg_images = [
    "test.png"
];

let index = 0;
const bg = document.getElementById("bg");

function showImage(i) {
    bg.style.backgroundImage = `url('${bg_images[i]}')`;
}

function nextImage() {
    index = (index + 1) % bg_images.length;
    showImage(index);
}

// auto rotate every 1 min
setInterval(nextImage, 60000);

// init
showImage(index);
</script>

</body>
</html>
