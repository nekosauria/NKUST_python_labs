<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖片上傳</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: #2e2e2e;
      --accent: #e8ff47;
      --text: #f0f0f0;
      --muted: #666;
      --radius: 12px;
    }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
    .subtitle { color: var(--muted); font-size: 0.85rem; margin-bottom: 32px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 520px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 36px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(232, 255, 71, 0.04);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .drop-zone .dz-icon { font-size: 28px; color: var(--muted); margin-bottom: 10px; }
    .drop-zone p { color: var(--muted); font-size: 0.85rem; }
    .drop-zone .fname { margin-top: 8px; color: var(--accent); font-size: 0.8rem; font-weight: 700; }

    .btn {
      display: block; width: 100%; margin-top: 18px; padding: 13px;
      background: var(--accent); color: #000; font-size: 0.95rem; font-weight: 700;
      border: none; border-radius: 8px; cursor: pointer;
      transition: opacity 0.2s, transform 0.1s; letter-spacing: 0.02em;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .status { margin-top: 12px; font-size: 0.8rem; color: var(--muted); text-align: center; min-height: 20px; }

    /* ── 標籤列 ── */
    .section-title {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.07em;
      margin-bottom: 10px;
    }
    .tags-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
    .tag {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 13px; font-size: 13px;
    }
    .tag .label { font-weight: 600; text-transform: capitalize; }
    .tag .score-bar-bg {
      width: 56px; height: 4px; background: var(--border);
      border-radius: 2px; overflow: hidden;
    }
    .tag .score-bar { height: 100%; background: var(--accent); border-radius: 2px; }
    .tag .score-val { font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; }

    .img-grid { display: flex; flex-direction: column; gap: 12px; }
    .img-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden;
    }
    .img-card .img-label {
      font-size: 11px; color: var(--muted); padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
    }
    .img-card img {
      width: 100%; display: block;
      height: auto;
    }

    .result-section { display: none; margin-top: 24px; }

    .curl-block { margin-top: 28px; width: 100%; max-width: 520px; }
    .curl-block summary { color: var(--muted); font-size: 0.78rem; cursor: pointer; user-select: none; margin-bottom: 8px; }
    pre {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; font-size: 0.72rem; color: #aaa;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>圖片上傳 API</h1>
  <p class="subtitle">上傳一張圖片，伺服器回傳物件偵測結果</p>

  <div class="card">
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*">
      <div class="dz-icon"><i class="ti ti-photo-up"></i></div>
      <p>點擊或拖曳圖片到這裡</p>
      <div class="fname" id="fname"></div>
    </div>

    <button class="btn" id="uploadBtn" disabled onclick="upload()">上傳圖片</button>
    <div class="status" id="status"></div>

    <div class="result-section" id="resultSection">
      <p class="section-title">偵測標籤</p>
      <div class="tags-row" id="tagsRow"></div>

      <p class="section-title">圖片比對</p>
      <div class="img-grid">
        <div class="img-card">
          <div class="img-label"><i class="ti ti-photo" style="font-size:14px"></i>原始圖片</div>
          <img id="oraImg" src="" alt="原始圖片">
        </div>
        <div class="img-card">
          <div class="img-label"><i class="ti ti-scan" style="font-size:14px"></i>偵測結果</div>
          <img id="detectImg" src="" alt="偵測結果">
        </div>
      </div>
    </div>
  </div>

  <details class="curl-block">
    <summary>▸ cURL 範例指令</summary>
    <pre>curl -X POST http://localhost:5001/upload \
  -F "image=@/path/to/your/image.jpg"</pre>
  </details>

  <script>
    const fileInput     = document.getElementById('fileInput');
    const uploadBtn     = document.getElementById('uploadBtn');
    const fnameEl       = document.getElementById('fname');
    const statusEl      = document.getElementById('status');
    const dropZone      = document.getElementById('dropZone');
    const resultSection = document.getElementById('resultSection');
    const tagsRow       = document.getElementById('tagsRow');
    const oraImg        = document.getElementById('oraImg');
    const detectImg     = document.getElementById('detectImg');

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        fnameEl.textContent = fileInput.files[0].name;
        uploadBtn.disabled = false;
      }
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      fileInput.files = e.dataTransfer.files;
      fileInput.dispatchEvent(new Event('change'));
    });

    async function upload() {
      const file = fileInput.files[0];
      if (!file) return;

      statusEl.textContent = '上傳中…';
      uploadBtn.disabled = true;
      resultSection.style.display = 'none';
      tagsRow.innerHTML = '';

      const form = new FormData();
      form.append('image', file);

      try {
        const res = await fetch('/upload', { method: 'POST', body: form });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        // 圖片
        oraImg.src    = data.ora_img;
        detectImg.src = data.detect_img;

        // 標籤 + 信心分數
        (data.tags || []).forEach(tag => {
          const score = data.scores?.[tag];
          const pct = score != null ? (score * 100).toFixed(2) : null;
          const el    = document.createElement('div');
          el.className = 'tag';
          el.innerHTML = `
            <span class="label">${tag}</span>
            ${pct != null ? `
              <div class="score-bar-bg">
                <div class="score-bar" style="width:${pct}%"></div>
              </div>
              <span class="score-val">${pct}%</span>
            ` : ''}
          `;
          tagsRow.appendChild(el);
        });

        resultSection.style.display = 'block';
        statusEl.textContent = '✓ 完成';
      } catch (e) {
        statusEl.textContent = '❌ 錯誤：' + e.message;
      } finally {
        uploadBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
